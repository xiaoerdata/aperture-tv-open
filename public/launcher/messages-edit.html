<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>家庭留言 · 开视</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#202c2b;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:760px;margin:auto;padding:28px 20px 48px}h1{font-size:28px;font-weight:600;margin:0}header p{margin:6px 0 24px;color:#52635e}h2{font-size:19px;margin:22px 0 12px}label{display:block;font-weight:600}textarea{display:block;resize:vertical;width:100%;min-height:132px;margin:8px 0;padding:14px;border:1px solid #bac6c1;border-radius:12px;background:white;font:inherit;color:inherit}button{min-height:44px;padding:9px 17px;border:1px solid #bdc9c3;border-radius:10px;background:#fff;color:inherit;font:inherit;cursor:pointer}button.primary{background:#254e42;border-color:#254e42;color:#fff}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible{outline:3px solid #4a8c77;outline-offset:3px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row small{margin-left:auto;color:#65746e}#status{min-height:26px;color:#425b50;overflow-wrap:anywhere}#notes{padding:0;list-style:none}#notes li{padding:18px 0;border-top:1px solid #d8dfdc}#notes p{margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}.delete{color:#963b32}#empty{color:#65746e}footer{font-size:14px;color:#65746e;margin-top:24px}
</style></head><body><main>
<header><h1>家庭留言</h1><p>写给家里的话，会显示在电视留言屏。</p></header>
<form id="editor"><label for="text" id="form-label">添加留言</label><textarea id="text" maxlength="500" placeholder="例如：晚饭在冰箱，记得热一下。" required></textarea><div class="row"><button class="primary" id="save" type="submit">保存到电视</button><button id="cancel" type="button" hidden>取消编辑</button><small id="counter">0 / 500</small></div></form>
<p id="status" role="status" aria-live="polite"></p><div class="row"><h2 id="list-title">电视上的留言</h2><button id="refresh" type="button">刷新</button></div><p id="empty">正在连接电视…</p><ul id="notes" aria-labelledby="list-title"></ul><footer>仅管理本机留言，不修改外部留言源。二维码10分钟有效；电视关闭此页面后连接失效。</footer>
</main><script>
(function(){'use strict';var token=location.hash.slice(1),revision=0,editing='',busy=false,connected=false;
function el(id){return document.getElementById(id);}try{history.replaceState(null,'',location.pathname);}catch(ignored){}
function state(text){el('status').textContent=text;}function lock(value){busy=value;el('save').disabled=value||!connected;el('refresh').disabled=value||!token;el('cancel').disabled=value;Array.prototype.forEach.call(el('notes').querySelectorAll('button'),function(b){b.disabled=value;});}
function reset(){editing='';el('text').value='';el('form-label').textContent='添加留言';el('cancel').hidden=true;count();}function count(){el('counter').textContent=el('text').value.length+' / 500';}
function request(method,data){return new Promise(function(resolve,reject){var r=new XMLHttpRequest();r.open(method,'/api/notes');r.timeout=10000;r.setRequestHeader('Authorization','Bearer '+token);if(data)r.setRequestHeader('Content-Type','application/json');r.onload=function(){var body;try{body=JSON.parse(r.responseText);}catch(e){reject(Error('连接失效，请重新扫描电视二维码'));return;}if(r.status!==200){var error=Error(body.error||'操作失败，请重试');error.status=r.status;reject(error);return;}resolve(body);};r.onerror=r.ontimeout=function(){reject(Error('无法连接电视，请检查同一网络，或重新扫码'));};r.send(data?JSON.stringify(data):null);});}
function render(data){if(!Array.isArray(data.messages)||data.messages.length>100||typeof data.revision!=='number')throw Error('留言数据无效');revision=data.revision;el('notes').textContent='';el('empty').hidden=data.messages.length>0;el('empty').textContent='还没有留言，写下第一条吧。';el('list-title').textContent='电视上的留言 · '+data.messages.length;
data.messages.forEach(function(note){var item=document.createElement('li'),text=document.createElement('p'),row=document.createElement('div'),edit=document.createElement('button'),remove=document.createElement('button');text.textContent=note.text;row.className='row';edit.textContent='编辑';remove.textContent='删除';remove.className='delete';edit.onclick=function(){if(busy)return;editing=note.id;el('text').value=note.text;el('form-label').textContent='编辑留言';el('cancel').hidden=false;count();el('text').focus();el('editor').scrollIntoView({block:'start'});};remove.onclick=function(){if(!busy&&confirm('删除这条留言？'))write({action:'delete',id:note.id,revision:revision},false);};row.appendChild(edit);row.appendChild(remove);item.appendChild(text);item.appendChild(row);el('notes').appendChild(item);});}
function load(){if(!token)return Promise.resolve();lock(true);return request('GET').then(function(data){render(data);connected=true;state('已连接电视');}).catch(function(error){state(error.message);}).then(function(){lock(false);});}
function write(data,clear){if(busy)return;lock(true);request('POST',data).then(function(next){render(next);if(clear)reset();else if(data.id===editing)reset();state('已保存，返回电视留言屏即可查看');}).catch(function(error){state(error.message);if(error.status===409)return request('GET').then(function(latest){render(latest);state('其他手机已更新列表，你的草稿仍保留。确认后再保存。');});}).catch(function(){state('连接已断开，你的草稿仍保留，请重新扫码。');}).then(function(){lock(false);});}
el('text').oninput=count;el('cancel').onclick=reset;el('refresh').onclick=load;el('editor').onsubmit=function(event){event.preventDefault();if(!busy&&connected&&el('text').value.trim())write({revision:revision,action:'save',id:editing,text:el('text').value},true);};
if(!/^[A-Za-z0-9_-]{32}$/.test(token)){token='';el('empty').textContent='请扫描电视上的二维码打开此页面。';state('未连接电视');lock(false);}else load();
}());
</script></body></html>
