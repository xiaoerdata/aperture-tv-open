<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上传到电视相册</title><style>body{margin:0;background:#f4f4f0;color:#202622;font:18px system-ui,sans-serif;padding:36px 22px;max-width:560px;margin:auto}h1{font-size:30px;margin-top:36px}p{line-height:1.6;color:#566158}button,label{display:block;padding:18px;background:#224e3d;color:white;border:0;border-radius:16px;text-align:center;font:inherit;cursor:pointer}input{width:100%;margin:22px 0}progress{width:100%;height:12px}#status{white-space:pre-line}small{color:#657067}</style><h1>把照片放到电视上</h1><p>同一家庭网络直传，照片保存在电视本机。请保持电视的二维码页面打开。</p><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp"><button id="send">上传照片</button><p id="status" role="status"></p><progress id="progress" value="0" max="1"></progress><p><small>支持JPEG、PNG、WebP，每张最多12MB。手机原图保留；电视会保存适合轮播的副本。</small></p><script>
(function(){'use strict';var token=location.hash.slice(1);history.replaceState(null,'',location.pathname);var input=document.getElementById('files'),button=document.getElementById('send'),status=document.getElementById('status'),progress=document.getElementById('progress');button.disabled=!/^[A-Za-z0-9_-]{32}$/.test(token);if(button.disabled)status.textContent='二维码已失效，请重新扫描电视上的二维码。';button.onclick=async function(){var files=Array.from(input.files);if(!files.length){status.textContent='请先选择照片';return;}button.disabled=true;input.disabled=true;progress.max=files.length;var saved=0,errors=[];for(var i=0;i<files.length;i++){status.textContent='正在上传 '+(i+1)+' / '+files.length;try{if(files[i].size>12*1024*1024)throw Error('照片超过12MB');var response=await fetch('/upload',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':files[i].type},body:files[i]});var reply=await response.json();if(!response.ok||!reply.saved)throw Error(reply.error||'保存失败');saved++;}catch(e){errors.push('第'+(i+1)+'张：'+e.message);}progress.value=i+1;}status.textContent='已保存 '+saved+' 张到电视'+(errors.length?'\n'+errors.join('\n'):'');button.disabled=false;input.disabled=false;};}());
</script></html>
