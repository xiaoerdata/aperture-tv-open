<!doctype html><html lang="zh-CN"><head><script src="/ui/compat.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11161c"><title>开视 · 家庭</title><link rel="stylesheet" href="/tv.css"><script type="module" src="/tv.js"></script><link rel="icon" data-kaishi-favicon type="image/webp" href="/launcher/brand/kaishi-icon-v2.webp"><link rel="stylesheet" href="/launcher/brand/identity.css"><script src="/launcher/brand/identity.js" defer></script></head>
<body><div class="tv-shell" id="tv-shell">
<header class="masthead"><a class="brand" href="/home" aria-label="返回首页"><img class="kaishi-brand-icon" data-kaishi-brand src="/launcher/brand/kaishi-icon-v2.webp" alt=""><span>开视</span></a><h1 id="home-name">家庭</h1><div class="family-clock"><time id="clock">--:--</time><span id="date-label"></span></div><button id="connect-button">连接家庭</button></header>
<main class="family-board"><section class="photo-section" aria-labelledby="photo-heading"><div class="section-heading"><h2 id="photo-heading">相册</h2><span id="photo-count"></span></div><figure id="memory-frame" hidden><img id="hero-photo" alt=""><figcaption id="photo-title"></figcaption><button id="next-photo" aria-label="下一张照片">下一张 ›</button></figure><p class="empty photo-empty" id="photo-empty">暂无照片</p></section>
<aside class="family-daily"><section class="today-panel" aria-labelledby="agenda-heading"><div class="section-heading"><h2 id="agenda-heading">今天</h2><span id="agenda-count"></span></div><ol class="agenda" id="agenda"></ol></section><section class="note-section" aria-labelledby="note-heading"><h2 id="note-heading">留言</h2><div class="notes" id="notes"></div></section></aside></main>
<footer class="control-bar"><span id="connection-status" role="status">尚未连接</span><span id="demo-label"></span><a id="native-menu" href="/native-menu" hidden>应用与系统</a><a href="/home">返回首页</a></footer>
</div><div id="dialog-backdrop" class="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title">连接家庭</h2><button id="close-dialog">返回</button></header><p id="pair-instructions">在手机工作台的「设备」中输入连接码。</p><strong id="pair-code" class="pair-code">··· ···</strong><p id="pair-status" role="status"></p><p id="pair-origin"></p><div class="dialog-actions"><button id="retry-pair">重新生成</button><button id="demo-button">查看示例</button></div></section></div><div id="toast" role="status" class="toast" hidden></div></body></html>
