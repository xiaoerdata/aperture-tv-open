<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭影院 · 开窗</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/cinema/style.css"><script type="module" src="/cinema/player.js"></script><link rel="stylesheet" href="/ui/material.css"><script type="module" src="/ui/material.js"></script></head><body><header class="cinema-header"><a href="/tv">◒ 开窗 <small>家庭影院</small></a><nav><a href="/guide#cinema">使用指引</a><a href="/tv" id="cinema-home">返回</a></nav></header><main class="cinema-main"><div class="cinema-intro"><div><h1>影视</h1><p hidden></p></div></div><p id="cinema-status" role="status">正在读取…</p><button id="cinema-connect" class="cinema-connect" hidden>连接家庭服务</button><nav class="cinema-filter" aria-label="媒体类型"><button data-media-filter="all" aria-pressed="true">全部</button><button data-media-filter="live" aria-pressed="false">直播</button><button data-media-filter="series" aria-pressed="false">电视剧</button><button data-media-filter="movies" aria-pressed="false">电影</button><button data-media-filter="library" aria-pressed="false">片库</button></nav><div class="cinema-tools"><label>搜索<input id="cinema-search" type="search" placeholder="搜索片名或媒体库"></label><button id="cinema-refresh">刷新</button></div><section class="cinema-grid" id="cinema-grid" aria-label="我的视频"></section><section id="cinema-player" class="cinema-player" hidden aria-label="视频播放器"><div class="player-heading"><h2 id="playing-title"></h2><button id="close-player">返回</button></div><video id="video" playsinline preload="metadata"></video><p id="player-status" role="status"></p><div class="playback-controls"><button id="play-pause">播放 / 暂停</button><button id="seek-back">后退10秒</button><button id="seek-forward">前进10秒</button></div></section></main></body></html>
